server = "https://mds-dev.micfong.space"
recipients = [
  "",
  "",
]
entries = [
  "part-ia/analysis-i/main.typ",
  "part-ia/differential-equations/main.typ",
  "part-ia/dynamics-and-relativity/main.typ",
  "part-ia/groups/main.typ",
  "part-ia/numbers-and-sets/main.typ",
  "part-ia/probability/main.typ",
  "part-ia/vectors-and-matrices/main.typ",
  "part-ib/optimisation/main.typ",
  "part-ib/variational-principles/main.typ",
]

[[series]]
entry = "part-ia/series.typ"
volumes = [
  "part-ia/groups/main.typ",
  "part-ia/vectors-and-matrices/main.typ",
  "part-ia/numbers-and-sets/main.typ",
  "part-ia/differential-equations/main.typ",
  "part-ia/analysis-i/main.typ",
  "part-ia/dynamics-and-relativity/main.typ",
]

[typst]
args = ["--root", ".", "--font-path", "fonts", "--ignore-system-fonts"]
creation-timestamp = "git-deps"

[renditions]
canonical = "light-sans"
all = ["light-sans", "dark-sans", "light-serif", "dark-serif"]
output = "build/{slug}.{theme}.{font}.pdf"

[renditions.inputs]
light-sans = { theme = "light", font = "sans" }
dark-sans = { theme = "dark", font = "sans" }
light-serif = { theme = "light", font = "serif" }
dark-serif = { theme = "dark", font = "serif" }

[digest]
fonts = "git-tracked"
